name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "dev", "hebrew-translation" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace -DskipFormatKtlint
      env:
        # Skips the Firebase plugins, which need google-services.json
        PULL_REQUEST: 'true'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: InnerTune-hebrew-debug
        path: app/build/outputs/apk/full/debug/*.apk
